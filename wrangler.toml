name = "daiso-mcp"
main = "src/index.ts"
compatibility_date = "2025-01-23"
compatibility_flags = ["nodejs_als"]

[build]
command = "npm run build:discovery"

[assets]
directory = "./public-discovery"
not_found_handling = "none"
html_handling = "none"

[vars]
HEALTH_CHECK_BASE_URL = "https://daiso-mcp.hmmhmmhm.workers.dev"

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false

[[durable_objects.bindings]]
name = "DAILY_RATE_LIMITER"
class_name = "DailyRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DailyRateLimiter"]

[[durable_objects.bindings]]
name = "UPSTREAM_ROUTE_HEALTH"
class_name = "UpstreamRouteHealth"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UpstreamRouteHealth"]

[triggers]
crons = ["*/5 * * * *"]
