name: Coverage

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'scripts/ops/README.md'
      - 'assets/analytics/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select-runner:
    uses: ./.github/workflows/select-local-runner.yml
    with:
      cloud-runner: ubuntu-latest
    secrets:
      status-token: ${{ secrets.LOCAL_RUNNER_STATUS_TOKEN }}

  coverage:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    name: Coverage 100%
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Coverage gate (100%)
        run: npm run test:coverage
