name: Deploy Web Read Lab
on:
  push:
    branches: [main]
    paths:
      - 'experiments/web-read-lab/**'
      - '.github/workflows/deploy-web-read-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --ignoreConfig --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution bundler --types @cloudflare/workers-types experiments/web-read-lab/worker.ts
      - run: npx vitest run tests/scripts/web-read-lab.test.ts
      - run: npx wrangler deploy --config experiments/web-read-lab/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
